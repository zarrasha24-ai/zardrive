name: Build Android apps

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: passenger, apk: ZarDrive, tag: test, label: ZarDrive, appid: '', defines: '' }
          - { app: driver, apk: ZarDrive-Driver, tag: test, label: ZarDrive Driver, appid: '', defines: '' }
          - { app: passenger, apk: Zarrasha-Rides, tag: rides-beta, label: Zarrasha Rides, appid: com.zarrasha.rides,
              defines: '--dart-define=START_URL=https://admin.zarrasha.com/beta/rides/ --dart-define=OUR_HOST=admin.zarrasha.com --dart-define="APP_TITLE=Zarrasha Rides" --dart-define=BRAND_COLOR=4291559963' }
          - { app: driver, apk: Zarrasha-Rides-Rider, tag: rides-beta, label: Zarrasha Rides Rider, appid: com.zarrasha.rides.rider,
              defines: '--dart-define=START_URL=https://admin.zarrasha.com/beta/rides-driver/ --dart-define=OUR_HOST=admin.zarrasha.com --dart-define="APP_TITLE=Zarrasha Rides Rider" --dart-define=BRAND_COLOR=4291559963' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create the Android project around our Dart code
        working-directory: apps/${{ matrix.app }}
        run: flutter create --platforms android --org com.zarrasha --project-name ${{ matrix.app == 'passenger' && 'zardrive' || 'zardrive_driver' }} .
      - name: Add the app name, icon, id and permissions
        env:
          GOOGLE_MAPS_KEY: ${{ matrix.tag == 'rides-beta' && secrets.GOOGLE_MAPS_KEY || '' }}
        run: python3 apps/tools/brand.py ${{ matrix.app }} "${{ matrix.label }}" "${{ matrix.appid }}"
      - name: Build APK
        working-directory: apps/${{ matrix.app }}
        env:
          HAS_GMAP: ${{ matrix.tag == 'rides-beta' && secrets.GOOGLE_MAPS_KEY != '' && '1' || '0' }}
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings || true
          echo "Google map in the app: $HAS_GMAP"
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 ${{ matrix.defines }} --dart-define=GMAP=$HAS_GMAP
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.apk }}-apk
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30
      - name: Name the APK for the release
        run: |
          cp apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ${{ matrix.apk }}.apk
          cp apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ${{ matrix.apk }}-old-phones.apk
          ls -la *.apk
      - name: Put the APK on its release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}
          name: ${{ matrix.tag == 'test' && 'ZarDrive test apps' || 'Zarrasha Rides beta apps' }}
          prerelease: true
          body: "${{ matrix.tag == 'test' && 'Latest test build of the ZarDrive passenger app (ZarDrive.apk) and driver app (ZarDrive-Driver.apk). Rebuilt on every push to main.' || 'Zarrasha Rides beta: customer app (Zarrasha-Rides.apk) opens admin.zarrasha.com/beta/rides, rider app (Zarrasha-Rides-Rider.apk) opens admin.zarrasha.com/beta/rides-driver. The plain .apk is for phones from about 2017 on (64-bit); -old-phones.apk is for older 32-bit phones. Rebuilt on every push to main.' }}"
          files: |
            ${{ matrix.apk }}.apk
            ${{ matrix.apk }}-old-phones.apk

  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring
      - name: Server tests
        working-directory: server
        run: |
          php tests/flow.php | tail -1
          php tests/places.php | tail -1
          php tests/apps.php | tail -1
